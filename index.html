<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angel, one important question 🛵</title>
<style>
:root{--bg:#ffe3ec;--card:#fff;--ink:#4a1030;--pink:#ff4d8d;--pink2:#ff8fb8;--no:#8a8a99;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1e;--card:#3b1629;--ink:#ffe3ee;--no:#a9a9ba}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{background:var(--card);border-radius:28px;padding:28px 22px;max-width:420px;width:92%;text-align:center;box-shadow:0 10px 40px rgba(255,77,141,.3)}
.scooty{font-size:64px;display:inline-block;animation:ride 1.6s ease-in-out infinite}
@keyframes ride{0%,100%{transform:translateX(-14px) rotate(-3deg)}50%{transform:translateX(14px) rotate(3deg)}}
h1{font-size:26px;line-height:1.25;margin:12px 0 8px}
p{margin:6px 0 20px;font-size:17px}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;min-height:90px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;padding:14px 28px;font-size:18px}
#yes{background:var(--pink);color:#fff;box-shadow:0 6px 18px rgba(255,77,141,.5);transition:transform .2s}
#no{background:var(--no);color:#fff;transition:left .25s,top .25s}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;text-align:center;padding:20px}
#splash .big{font-size:80px;animation:ride 1.2s infinite}
#splash button{background:var(--pink);color:#fff}
#win{display:none}
.heart{position:fixed;top:-30px;font-size:26px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#music{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0}
</style>
</head>
<body>

<div id="splash">
  <div class="big">💌</div>
  <h2>Angel, you have 1 new message from Devil 😈</h2>
  <button id="open">Tap to open 💖</button>
</div>

<div class="card" id="ask">
  <div class="scooty">🛵</div>
  <h1>Angel, will you take me out on a date with your Scooty?</h1>
  <p>I want to sit behind you 🥺</p>
  <p style="margin-top:-8px;font-weight:700">— Devil 😈</p>
  <div class="btns">
    <button id="yes">YES 💖</button>
    <button id="no">NO</button>
  </div>
</div>

<div class="card" id="win">
  <div class="scooty">🛵💨</div>
  <h1>Yayyy!! 🎉</h1>
  <p>Good choice, Angel! Be ready, I'm sitting behind you and holding on tight to the seat (promise 😇).</p>
  <p style="font-weight:700">— Your Devil 😈💖</p>
</div>

<script>
var lines = ["NO","Nope 🙈","Oops, missed!","Too slow 😜","Try again 😏","Can't catch me","Just say YES 💖","Seriously? 😂","Angel pleaseee 🥺"];
var tries = 0, scale = 1;
var yes = document.getElementById("yes"), no = document.getElementById("no");

function startMusic(){
  var a = document.getElementById("music");
  try{ a.currentTime = 0; var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
}
document.getElementById("open").onclick = function(){
  document.getElementById("splash").style.display = "none";
  startMusic();
};

function dodge(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  tries++;
  no.textContent = lines[tries % lines.length];
  scale = Math.min(scale + 0.18, 2.4);
  yes.style.transform = "scale(" + scale + ")";
  no.style.position = "fixed";
  var w = no.offsetWidth, h = no.offsetHeight;
  var x = Math.random() * (window.innerWidth - w - 20) + 10;
  var y = Math.random() * (window.innerHeight - h - 20) + 10;
  no.style.left = x + "px";
  no.style.top = y + "px";
  no.style.zIndex = 5;
}
["pointerenter","pointerdown","touchstart","mousedown","click","focus"].forEach(function(ev){
  no.addEventListener(ev, dodge, {passive:false});
});

yes.onclick = function(){
  document.getElementById("ask").style.display = "none";
  no.style.display = "none";
  document.getElementById("win").style.display = "block";
  var hearts = ["💖","💕","🛵","💗","✨"];
  for(var i=0;i<45;i++){
    var s = document.createElement("span");
    s.className = "heart";
    s.textContent = hearts[i % hearts.length];
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = (2 + Math.random()*3) + "s";
    s.style.animationDelay = (Math.random()*1.5) + "s";
    document.body.appendChild(s);
  }
};
</script>
</body>
